<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="sensorium-arch-title sensorium-arch-desc">
  <title id="sensorium-arch-title">Sensorium architecture</title>
  <desc id="sensorium-arch-desc">The Sensorium viewer app on the machine you work from exchanges input and H.264 video with the Sensorium Host app on the host machine over a Tailscale tailnet; the host streams either a session canvas it creates or, when armed, one existing host screen.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7C70F5"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- zones -->
  <rect x="32" y="88" width="240" height="208" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="80" y="92" width="144" height="12" rx="2" fill="#f5f5f5"/>
  <text x="152" y="101" fill="rgba(45,49,66,0.45)" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">VIEWER · THE MACHINE YOU WORK FROM</text>

  <rect x="376" y="88" width="352" height="208" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="464" y="92" width="176" height="12" rx="2" fill="#f5f5f5"/>
  <text x="552" y="101" fill="rgba(45,49,66,0.45)" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">HOST · THE MACHINE YOU WORK ON</text>

  <!-- link caption -->
  <text x="352" y="72" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.10em">TAILSCALE TAILNET · QUIC · PINNED IDENTITY</text>

  <!-- arrows -->
  <line x1="232" y1="140" x2="472" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="304" y="120" width="96" height="12" rx="2" fill="#f5f5f5"/>
  <text x="352" y="129" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">INPUT · CLIPBOARD</text>

  <line x1="472" y1="164" x2="232" y2="164" stroke="#7C70F5" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="316" y="172" width="72" height="12" rx="2" fill="#f5f5f5"/>
  <text x="352" y="181" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">H.264 VIDEO</text>

  <line x1="524" y1="184" x2="524" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="516" y="208" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="end" letter-spacing="0.06em">CREATES</text>

  <line x1="580" y1="224" x2="580" y2="184" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="588" y="208" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="start" letter-spacing="0.06em">CAPTURES · ARMED AT PAIRING</text>

  <!-- viewer app -->
  <rect x="72" y="120" width="160" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="72" y="120" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="80" y="126" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="94" y="135" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
  <text x="152" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">Sensorium</text>
  <text x="152" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">decode · present · input</text>

  <!-- host app (focal) -->
  <rect x="472" y="120" width="160" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="472" y="120" width="160" height="64" rx="6" fill="rgba(124,112,245,0.08)" stroke="#7C70F5" stroke-width="1"/>
  <rect x="480" y="126" width="28" height="12" rx="2" fill="transparent" stroke="rgba(124,112,245,0.50)" stroke-width="0.8"/>
  <text x="494" y="135" fill="rgba(124,112,245,0.9)" font-size="7" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
  <text x="552" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">Sensorium Host</text>
  <text x="552" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">pair · capture · encode</text>

  <!-- session canvas -->
  <rect x="408" y="224" width="136" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="408" y="224" width="136" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="476" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">Session canvas</text>
  <text x="476" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">virtual · per session</text>

  <!-- host screen -->
  <rect x="568" y="224" width="136" height="56" rx="6" fill="#f5f5f5"/>
  <rect x="568" y="224" width="136" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="636" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">Host screen</text>
  <text x="636" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', 'SF Mono', Menlo, monospace" text-anchor="middle">existing · armed at host</text>
</svg>
