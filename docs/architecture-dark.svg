<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="t d">
  <title id="t">How Sensorium fits together</title>
  <desc id="d">The Sensorium app on the machine you sit at sends input and clipboard to the Sensorium Host app on the machine you reach, and receives H.264 video back, which it shows in a session window, directly over your Tailscale tailnet using QUIC with a pinned identity. The host captures one of its existing screens, which pairing arms. Only if the person at the host turns it on, it can instead create a private virtual desktop for the session.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker>
    <marker id="b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9088f8"/></marker>
  </defs>
  <style>
    .flow { fill: none; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 2 12; animation: flow 1s linear infinite; }
    .fast { animation-duration: 0.5s; }
    .live { animation: live 1.6s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -14; } }
    @keyframes live { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) { .flow, .live { animation: none; } .flow { opacity: 0; } }
  </style>
  <rect x="24" y="64" width="248" height="252" rx="6" fill="rgba(230,237,243,0.03)" stroke="#3d444d"/>
  <text x="40" y="86" fill="#9198a1" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" letter-spacing="0.12em">THE MACHINE YOU SIT AT</text>
  <text x="40" y="102" fill="#9198a1" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" letter-spacing="0.12em">MACOS OR FEDORA</text>
  <rect x="424" y="64" width="352" height="252" rx="6" fill="rgba(230,237,243,0.03)" stroke="#3d444d"/>
  <text x="440" y="86" fill="#9198a1" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" letter-spacing="0.12em">THE MACHINE YOU REACH</text>
  <text x="440" y="102" fill="#9198a1" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" letter-spacing="0.12em">MACOS</text>

  <text x="348" y="40" fill="#9198a1" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.12em">YOUR TAILNET · QUIC · PINNED IDENTITY</text>
  <text x="348" y="54" fill="#9198a1" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.12em">NO ACCOUNT · NO RELAY · NO CLOUD</text>

  <rect x="56" y="130" width="176" height="64" rx="6" fill="#151b23" stroke="#3d444d"/>
  <text x="144" y="158" fill="#e6edf3" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Sensorium</text>
  <text x="144" y="178" fill="#9198a1" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">decode · show · input</text>

  <rect x="488" y="130" width="176" height="64" rx="6" fill="#151b23" stroke="#9088f8"/>
  <text x="576" y="158" fill="#e6edf3" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Sensorium Host</text>
  <text x="576" y="178" fill="#9198a1" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">pair · capture · encode</text>

  <line x1="232" y1="150" x2="486" y2="150" stroke="#9198a1" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="348" y="142" fill="#9198a1" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">INPUT · CLIPBOARD</text>
  <line x1="488" y1="176" x2="234" y2="176" stroke="#9088f8" stroke-width="1.2" marker-end="url(#b)"/>
  <text x="348" y="192" fill="#9088f8" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">H.264 VIDEO</text>

  <rect x="56" y="244" width="176" height="56" rx="6" fill="#151b23" stroke="#3d444d"/>
  <text x="144" y="267" fill="#e6edf3" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Session window</text>
  <text x="144" y="285" fill="#9198a1" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">the host screen, live</text>
  <line x1="144" y1="194" x2="144" y2="242" stroke="#9198a1" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="152" y="224" fill="#9198a1" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" letter-spacing="0.08em">SHOWS</text>

  <rect x="440" y="244" width="152" height="56" rx="6" fill="rgba(124,112,245,0.16)" stroke="#9088f8"/>
  <text x="516" y="267" fill="#e6edf3" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Host screen</text>
  <text x="516" y="285" fill="#9198a1" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">existing display · armed</text>
  <line x1="532" y1="244" x2="532" y2="196" stroke="#9088f8" stroke-width="1.2" marker-end="url(#b)"/>
  <text x="524" y="224" fill="#9198a1" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end" letter-spacing="0.08em">CAPTURES</text>

  <rect x="608" y="244" width="152" height="56" rx="6" fill="none" stroke="#3d444d" stroke-dasharray="4,3"/>
  <text x="684" y="267" fill="#e6edf3" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Private desktop</text>
  <text x="684" y="285" fill="#9198a1" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.04em">virtual · off by default</text>
  <line x1="628" y1="196" x2="628" y2="242" stroke="#9198a1" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="636" y="224" fill="#9198a1" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start" letter-spacing="0.08em">CREATES, IF ALLOWED</text>
  <line class="flow" x1="234" y1="150" x2="476" y2="150" stroke="#e6edf3"/>
  <line class="flow fast" x1="486" y1="176" x2="244" y2="176" stroke="#F0A8D0"/>
  <line class="flow fast" x1="532" y1="242" x2="532" y2="206" stroke="#F0A8D0"/>
  <line class="flow" x1="144" y1="196" x2="144" y2="232" stroke="#e6edf3"/>
  <circle class="live" cx="76" cy="263" r="3.5" fill="#F0A8D0"/>
</svg>
