name: release-linux

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the Fedora package to, for example v1.2.3
        required: true
        type: string

permissions: {}

jobs:
  fedora-package:
    runs-on: ubuntu-latest
    container: fedora:44
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Install dependencies
        # The packages the linux-package job in ci.yml installs, plus gh to
        # reach the release.
        run: dnf install -y swift-lang cairo-devel ffmpeg-free-devel git glib2-devel gtk4-devel libglvnd-devel libva-devel libxkbcommon-devel mesa-libgbm-devel openssl-devel pango-devel pkgconf-pkg-config python3 wayland-devel rpm-build desktop-file-utils appstream gh

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Check the tag matches VERSION
        run: |
          if [ "$(cat VERSION)" != "${TAG#v}" ]; then
            echo "VERSION is $(cat VERSION) but the tag is $TAG." >&2
            exit 1
          fi

      - name: Build the package
        run: sh Scripts/package-linux.sh

      - name: Install, check and remove the package
        run: sh Scripts/test-package-linux.sh

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh runs git in the workspace, which the container user does not own.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release upload "$TAG" Artifacts/*.rpm Artifacts/*.rpm.sha256 --clobber -R "${{ github.repository }}"

      - name: Check the release carries the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "${{ github.repository }}" --json assets --jq '.assets[].name' | tee assets.txt
          grep -q '\.rpm$' assets.txt
